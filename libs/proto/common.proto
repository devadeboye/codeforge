syntax = "proto3";

package codeforge.common.v1;

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_OWNER = 1;
  ROLE_EDITOR = 2;
  ROLE_VIEWER = 3;
}

message PaginationRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message PaginationResponse {
  int32 total_count = 1;
  int32 page = 2;
  int32 page_size = 3;
  int32 total_pages = 4;
}

message ErrorDetail {
  string code = 1;
  string message = 2;
  string field = 3;
}

message UserSummary {
  string id = 1;
  string username = 2;
  string display_name = 3;
  string avatar_url = 4;
  string cursor_color = 5;
}

